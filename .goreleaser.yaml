version: 2

before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - name: aurl-v1
    repository:
      owner: classmethod
      name: homebrew-repos
    directory: Formula
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/classmethod/aurl"
    description: "URL Command Line Tool with Authentication Support (v1)"
    install: |
      bin.install "aurl"
    test: |
      system "#{bin}/aurl --version"
    custom_block: |
      conflicts_with "aurl", because: "both install 'aurl' binary"
    caveats: |
      This is the v1 series of aurl.
      To move to aurl (v2), run `brew uninstall aurl-v1 && brew install aurl`,
      then run `aurl migrate` to migrate your configuration.
